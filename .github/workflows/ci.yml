{
  "name": "CI",
  "on": {
    "pull_request": {},
    "workflow_dispatch": {
      "inputs": {
        "level": {
          "description": "Verification depth (release also checks pinned theme visuals)",
          "type": "choice",
          "options": [
            "routine",
            "integration",
            "release"
          ],
          "default": "release"
        },
        "compatibility": {
          "description": "Also check other supported Node majors",
          "type": "boolean",
          "default": false
        },
        "stress": {
          "description": "Also check supported profile restore scale",
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "checks": {
      "name": "macOS \u00b7 Python 3.14 \u00b7 Node 24",
      "runs-on": "macos-15",
      "timeout-minutes": 60,
      "env": {
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_ASKPASS": "/usr/bin/false",
        "SSH_ASKPASS": "/usr/bin/false"
      },
      "steps": [
        {
          "name": "Check out the public tree",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "set-safe-directory": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Select additional verification",
          "id": "scope",
          "env": {
            "EVENT": "${{ github.event_name }}",
            "BASE_SHA": "${{ github.event.pull_request.base.sha }}",
            "LEVEL": "${{ inputs.level }}"
          },
          "run": "python3 - <<'PY_SCOPE'\nimport os\nimport subprocess\nfrom pathlib import Path\n\nfrom scripts.run_tests import RELEASE_MODULES\n\nif os.environ[\"EVENT\"] == \"pull_request\":\n    paths = subprocess.check_output([\n        \"git\", \"diff\", \"--name-only\", \"-z\", os.environ[\"BASE_SHA\"], \"HEAD\"\n    ]).decode().split(\"\\0\")\n    paths = [path for path in paths if path]\n    routine = lambda p: p in {\"README.md\", \"CONTRIBUTING.md\", \"LICENSE\"} or p.startswith((\n        \"docs/\", \"skills/\", \"apps/system-index/\", \"packages/ui/src/\",\n        \"examples/\", \"platform_assets/\"))\n    # These components already have their real journeys in integration.\n    integration_runtime = {\n        \"config\", \"render\", \"services\", \"host_commands\", \"host_profile\",\n        \"host_profile_store\", \"host_profile_backup\", \"host_profile_recovery\",\n    }\n    def needs_release(path):\n        if routine(path):\n            return False\n        source = Path(path)\n        if source.parent == Path(\"local_web_server\") and source.suffix == \".py\":\n            return source.stem not in integration_runtime\n        if source.parent == Path(\"tests\") and source.name.startswith(\"test_\") and source.suffix == \".py\":\n            return source.stem.removeprefix(\"test_\") in RELEASE_MODULES | {\"run_tests\"}\n        # Shared test helpers, templates and unknown paths exercise the full gate.\n        return True\n    integration = any(not routine(p) for p in paths)\n    release = any(needs_release(p) for p in paths)\n    visual = release or any(p.startswith((\"packages/ui/\", \"examples/ui-gallery/\", \"platform_assets/\")) or p in {\n        \"local_web_server/theme_gate.py\", \"tests/test_theme_gate.py\"\n    } for p in paths)\nelse:\n    integration = os.environ[\"LEVEL\"] in {\"integration\", \"release\"}\n    release = os.environ[\"LEVEL\"] == \"release\"\n    visual = release\nwith Path(os.environ[\"GITHUB_OUTPUT\"]).open(\"a\") as output:\n    for name, value in ((\"integration\", integration), (\"release\", release), (\"visual\", visual)):\n        output.write(f\"{name}={str(value).lower()}\\n\")\nPY_SCOPE"
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "24",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Install the Chromium test browser",
          "run": "npx playwright install chromium"
        },
        {
          "name": "Compile Python sources",
          "run": "python3 -m compileall -q local_web_server scripts tests"
        },
        {
          "name": "Run routine contracts and functional browser journeys",
          "run": "PYTHONWARNINGS=error::ResourceWarning npm run check"
        },
        {
          "name": "Install Caddy 2",
          "run": "brew install caddy",
          "if": "steps.scope.outputs.integration == 'true'"
        },
        {
          "name": "Report the selected Caddy version",
          "run": "caddy version | grep -E '^v2[.]'",
          "if": "steps.scope.outputs.integration == 'true'"
        },
        {
          "name": "Provision the isolated runner npm",
          "run": "/opt/homebrew/bin/npm install --global npm@11.19.0 --ignore-scripts",
          "if": "steps.scope.outputs.release == 'true'"
        },
        {
          "name": "Report the isolated runner npm version",
          "run": "/opt/homebrew/bin/npm --version | grep -Fx '11.19.0'",
          "if": "steps.scope.outputs.release == 'true'"
        },
        {
          "name": "Run relevant integration and recovery checks",
          "if": "steps.scope.outputs.integration == 'true'",
          "run": "PYTHONWARNINGS=error::ResourceWarning npm run check:integration"
        },
        {
          "name": "Run additional release lifecycle checks",
          "if": "steps.scope.outputs.release == 'true'",
          "run": "LOCAL_WEB_REQUIRE_CADDY_INTEGRATION=1 PYTHONWARNINGS=error::ResourceWarning npm run test:python:release && npm run verify:new-app && npm run verify:new-service-app && npm run verify:repository-service-transition"
        },
        {
          "name": "Check pinned theme visuals",
          "if": "steps.scope.outputs.visual == 'true'",
          "run": "npm run test:gallery:visual"
        },
        {
          "name": "Retain failed visual comparisons",
          "if": "failure() && steps.scope.outputs.visual == 'true'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "theme-visual-differences",
            "path": "examples/ui-gallery/test-results/**/*.png",
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Check optional supported scale",
          "if": "github.event_name == 'workflow_dispatch' && inputs.stress",
          "run": "PYTHONWARNINGS=error::ResourceWarning npm run test:python:stress"
        },
        {
          "name": "Audit locked dependencies",
          "run": "npm audit"
        }
      ]
    },
    "compatibility": {
      "name": "Compatibility (Node ${{ matrix.node }})",
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "env": {
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_ASKPASS": "/usr/bin/false",
        "SSH_ASKPASS": "/usr/bin/false"
      },
      "steps": [
        {
          "name": "Check out the public tree",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "set-safe-directory": false
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Install Chromium",
          "run": "npx playwright install chromium"
        },
        {
          "name": "Run the build-once frontend checks",
          "run": "npm run check:frontend"
        },
        {
          "name": "Run critical browser journeys",
          "run": "npm run check:frontend:browser:prepared"
        }
      ],
      "if": "github.event_name == 'workflow_dispatch' && inputs.compatibility",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            22,
            26
          ]
        }
      }
    }
  }
}
