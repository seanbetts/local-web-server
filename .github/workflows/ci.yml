{
  "name": "CI",
  "on": {
    "pull_request": {},
    "workflow_dispatch": {
      "inputs": {
        "compatibility": {
          "description": "Also check other supported Node majors",
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "python": {
      "name": "Python 3.14",
      "runs-on": "macos-15",
      "timeout-minutes": 15,
      "env": {
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_ASKPASS": "/usr/bin/false",
        "SSH_ASKPASS": "/usr/bin/false"
      },
      "steps": [
        {
          "name": "Check out the public tree",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "set-safe-directory": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "24",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Provision the isolated runner npm",
          "run": "/opt/homebrew/bin/npm install --global npm@11.19.0 --ignore-scripts"
        },
        {
          "name": "Report the isolated runner npm version",
          "run": "/opt/homebrew/bin/npm --version | grep -Fx '11.19.0'"
        },
        {
          "name": "Install the Chromium test browser",
          "run": "npx playwright install chromium"
        },
        {
          "name": "Install Caddy 2",
          "run": "brew install caddy"
        },
        {
          "name": "Report the selected Caddy version",
          "run": "caddy version | grep -E '^v2[.]'"
        },
        {
          "name": "Compile Python sources",
          "run": "python3 -m compileall -q local_web_server scripts tests"
        },
        {
          "name": "Run the fast Python suite",
          "run": "LOCAL_WEB_REQUIRE_CADDY_INTEGRATION=1 PYTHONWARNINGS=error::ResourceWarning npm run test:python"
        },
        {
          "name": "Run the Python acceptance suite",
          "run": "LOCAL_WEB_REQUIRE_CADDY_INTEGRATION=1 PYTHONWARNINGS=error::ResourceWarning npm run test:python:acceptance"
        },
        {
          "name": "Run critical browser journeys",
          "run": "npm run check:frontend:browser"
        }
      ]
    },
    "node": {
      "name": "Frontend (Node 24)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_ASKPASS": "/usr/bin/false",
        "SSH_ASKPASS": "/usr/bin/false"
      },
      "steps": [
        {
          "name": "Check out the public tree",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "set-safe-directory": false
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "24",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Run the build-once frontend checks",
          "run": "npm run check:frontend"
        },
        {
          "name": "Verify the public release surface",
          "run": "npm run verify:public-release"
        },
        {
          "name": "Audit all production and development dependencies",
          "run": "npm audit"
        },
        {
          "name": "Audit production dependencies",
          "run": "npm audit --omit=dev"
        }
      ]
    },
    "compatibility": {
      "name": "Compatibility (Node ${{ matrix.node }})",
      "runs-on": "macos-15",
      "timeout-minutes": 10,
      "env": {
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_ASKPASS": "/usr/bin/false",
        "SSH_ASKPASS": "/usr/bin/false"
      },
      "steps": [
        {
          "name": "Check out the public tree",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "set-safe-directory": false
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Install Chromium",
          "run": "npx playwright install chromium"
        },
        {
          "name": "Run the build-once frontend checks",
          "run": "npm run check:frontend"
        },
        {
          "name": "Run critical browser journeys",
          "run": "npm run check:frontend:browser:prepared"
        }
      ],
      "if": "github.event_name == 'workflow_dispatch' && inputs.compatibility",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            22,
            26
          ]
        }
      }
    }
  }
}
