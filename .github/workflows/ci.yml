{
  "name": "CI",
  "on": {
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "python": {
      "name": "Python 3.14",
      "runs-on": "macos-15",
      "timeout-minutes": 60,
      "env": {
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_ASKPASS": "/usr/bin/false",
        "SSH_ASKPASS": "/usr/bin/false"
      },
      "steps": [
        {
          "name": "Check out the public tree",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "set-safe-directory": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "24",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Install the Chromium test browser",
          "run": "npx playwright install chromium"
        },
        {
          "name": "Install Caddy 2",
          "run": "brew install caddy"
        },
        {
          "name": "Report the selected Caddy version",
          "run": "caddy version | grep -E '^v2[.]'"
        },
        {
          "name": "Compile Python sources",
          "run": "python3 -m compileall -q local_web_server scripts tests"
        },
        {
          "name": "Run the complete Python suite",
          "run": "LOCAL_WEB_REQUIRE_CADDY_INTEGRATION=1 PYTHONWARNINGS=error::ResourceWarning npm run test:python:all"
        },
        {
          "name": "Run the disposable host-profile workflow",
          "run": "python3 scripts/verify_host_profile_workflow.py"
        }
      ]
    },
    "node": {
      "name": "Node ${{ matrix.node }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_TERMINAL_PROMPT": "0",
        "GIT_ASKPASS": "/usr/bin/false",
        "SSH_ASKPASS": "/usr/bin/false"
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            22,
            24,
            26
          ]
        }
      },
      "steps": [
        {
          "name": "Check out the public tree",
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "set-safe-directory": false
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm",
            "cache-dependency-path": "package-lock.json"
          }
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Run the build-once frontend checks",
          "run": "npm run check:frontend"
        },
        {
          "name": "Verify the public release surface",
          "run": "npm run verify:public-release"
        },
        {
          "name": "Audit all production and development dependencies",
          "run": "npm audit"
        },
        {
          "name": "Audit production dependencies",
          "run": "npm audit --omit=dev"
        }
      ]
    }
  }
}
